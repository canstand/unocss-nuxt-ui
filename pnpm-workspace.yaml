minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

packages:
  - playground

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  simple-git-hooks: true
  unrs-resolver: false
  vue-demi: false

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@comark/vue': ^0.9.0
  '@iconify-json/lucide': ^1.2.152
  '@iconify-json/simple-icons': ^1.2.101
  '@iconify-json/vscode-icons': ^1.2.96
  '@internationalized/date': ^3.12.4
  '@nuxt/content': ^3.16.2
  '@nuxt/devtools': ^4.1.0
  '@nuxt/eslint-config': 1.15.2
  '@nuxt/kit': ^4.6.4
  '@nuxt/module-builder': ^1.0.3
  '@nuxt/schema': ^4.6.4
  '@nuxt/test-utils': ^4.4.0
  '@nuxt/ui': ^4.12.0
  '@nuxtjs/mdc': ^0.23.2
  '@tanstack/charts': ^1.5.0
  '@tanstack/vue-table': ^8.21.3
  '@types/node': latest
  '@unocss/core': ^66.12.0
  '@unocss/eslint-plugin': ^66.12.0
  '@unocss/nuxt': ^66.12.0
  '@unocss/preset-wind4': ^66.12.0
  '@vueuse/core': ^15.0.0
  better-sqlite3: ^13.0.3
  changelogen: ^0.6.2
  defu: ^6.1.7
  eslint: ^10.14.0
  eslint-plugin-format: ^2.0.1
  lint-staged: ^17.6.0
  nuxt: ^4.6.4
  scule: ^1.3.0
  simple-git-hooks: ^2.14.0
  typescript: ~6.0.3
  unocss: ^66.12.0
  vitest: ^5.1.0
  # vue-tsc 3.3.12+ corrupts template codegen for `//` in component props.
  # See https://github.com/vuejs/language-tools/issues/6322
  vue-tsc: 3.3.11
  zod: ^4.6.7
